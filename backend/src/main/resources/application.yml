server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: workspace-api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/workspace?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC}
    username: ${DB_USERNAME:workspace}
    password: ${DB_PASSWORD:workspace_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
app:
  cors-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  token-hours: ${APP_TOKEN_HOURS:8}
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:false}
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:}
